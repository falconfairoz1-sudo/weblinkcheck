<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkGuard Protection</title>
  <link rel="stylesheet" href="../browser-extension/popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo">
        <img src="icons/icon32.png" alt="LinkGuard" class="logo-icon">
        <h1>LinkGuard</h1>
      </div>
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span class="status-text">Protected</span>
      </div>
    </header>

    <!-- Current Page Status -->
    <section class="current-page">
      <h2>Current Page</h2>
      <div class="page-info" id="pageInfo">
        <div class="page-url" id="pageUrl">Loading...</div>
        <div class="page-status" id="pageStatus">
          <span class="status-icon">🔄</span>
          <span class="status-message">Scanning...</span>
        </div>
        <div class="risk-score" id="riskScore" style="display: none;">
          <div class="score-label">Risk Score</div>
          <div class="score-value">0/100</div>
        </div>
      </div>
    </section>

    <!-- Quick Actions -->
    <section class="quick-actions">
      <button class="action-btn primary" id="scanCurrentPage">
        <span class="btn-icon">🔍</span>
        Scan This Page
      </button>
      <button class="action-btn secondary" id="openDashboard">
        <span class="btn-icon">📊</span>
        Open Dashboard
      </button>
    </section>

    <!-- Statistics -->
    <section class="stats">
      <h3>Today's Protection</h3>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-number" id="scannedCount">0</div>
          <div class="stat-label">Links Scanned</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="blockedCount">0</div>
          <div class="stat-label">Threats Blocked</div>
        </div>
      </div>
    </section>

    <!-- Settings Toggle -->
    <section class="settings">
      <div class="setting-item">
        <label class="setting-label">
          <input type="checkbox" id="enableProtection" checked>
          <span class="checkmark"></span>
          Real-time Protection
        </label>
      </div>
      <div class="setting-item">
        <label class="setting-label">
          <input type="checkbox" id="showNotifications" checked>
          <span class="checkmark"></span>
          Threat Notifications
        </label>
      </div>
      <div class="setting-item">
        <label class="setting-label">
          <input type="checkbox" id="blockDangerous">
          <span class="checkmark"></span>
          Auto-block Dangerous Sites
        </label>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <button class="footer-btn" id="settingsBtn">⚙️ Settings</button>
      <button class="footer-btn" id="helpBtn">❓ Help</button>
      <button class="footer-btn" id="reportBtn">🚨 Report Issue</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
