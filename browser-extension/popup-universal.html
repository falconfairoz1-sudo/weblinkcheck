<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkGuard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1b;
            color: #ffffff;
            width: 320px;
            min-height: 400px;
        }

        .popup-container {
            padding: 0;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 16px;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .logo-icon {
            font-size: 20px;
        }

        .logo h1 {
            font-size: 16px;
            font-weight: 600;
            color: white;
        }

        .status {
            font-size: 12px;
            color: rgba(255,255,255,0.8);
        }

        .current-page {
            padding: 16px;
            border-bottom: 1px solid #2a2a2b;
        }

        .page-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e5e5e5;
        }

        .page-url {
            font-size: 11px;
            color: #a1a1aa;
            margin-bottom: 12px;
            word-break: break-all;
            line-height: 1.3;
        }

        .page-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .page-status.safe {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .page-status.warning {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .page-status.danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .page-status.unknown {
            background: rgba(107, 114, 128, 0.1);
            color: #6b7280;
        }

        .actions {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a6fd8;
        }

        .btn-secondary {
            background: #2a2a2b;
            color: #e5e5e5;
            border: 1px solid #3a3a3b;
        }

        .btn-secondary:hover {
            background: #3a3a3b;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .settings {
            padding: 16px;
            border-top: 1px solid #2a2a2b;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .setting-item:last-child {
            margin-bottom: 0;
        }

        .toggle {
            position: relative;
            width: 40px;
            height: 20px;
            background: #3a3a3b;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .toggle.active {
            background: #667eea;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .toggle.active::after {
            transform: translateX(20px);
        }

        .footer {
            padding: 12px 16px;
            text-align: center;
            border-top: 1px solid #2a2a2b;
            background: #0f0f10;
        }

        .footer-links {
            display: flex;
            justify-content: space-around;
            gap: 8px;
        }

        .footer-link {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: #e5e5e5;
        }

        .loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div class="header">
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <h1>LinkGuard</h1>
            </div>
            <div class="status" id="extensionStatus">Universal Protection Active</div>
        </div>

        <div class="current-page">
            <div class="page-title">Current Page</div>
            <div class="page-url" id="currentUrl">Loading...</div>
            <div class="page-status unknown" id="pageStatus">
                <span id="statusIcon">🔄</span>
                <span id="statusText">Analyzing...</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="scanBtn">
                <span id="scanIcon">🔍</span>
                <span id="scanText">Scan This Page</span>
            </button>
            
            <button class="btn btn-secondary" id="openScannerBtn">
                <span>🚀</span>
                Open Full Scanner
            </button>
        </div>

        <div class="settings">
            <div class="setting-item">
                <span>Real-time Protection</span>
                <div class="toggle active" id="protectionToggle"></div>
            </div>
            
            <div class="setting-item">
                <span>Show Notifications</span>
                <div class="toggle active" id="notificationToggle"></div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-links">
                <a href="#" class="footer-link" id="helpLink">Help</a>
                <a href="#" class="footer-link" id="settingsLink">Settings</a>
                <a href="#" class="footer-link" id="aboutLink">About</a>
            </div>
        </div>
    </div>

    <script>
        // Universal Browser API wrapper
        const browserAPI = (function() {
            if (typeof chrome !== 'undefined' && chrome.runtime) {
                return chrome;
            } else if (typeof browser !== 'undefined' && browser.runtime) {
                return browser;
            } else {
                return null;
            }
        })();

        class LinkGuardPopup {
            constructor() {
                this.currentTab = null;
                this.settings = {};
                this.init();
            }

            async init() {
                try {
                    console.log('Initializing LinkGuard popup...');
                    
                    // Get current tab
                    await this.getCurrentTab();
                    
                    // Load settings
                    await this.loadSettings();
                    
                    // Initialize UI
                    this.initializeUI();
                    
                    // Bind events
                    this.bindEvents();
                    
                    // Scan current page
                    await this.scanCurrentPage();
                    
                } catch (error) {
                    console.error('Error initializing popup:', error);
                    this.showError('Failed to initialize extension');
                }
            }

            async getCurrentTab() {
                try {
                    if (browserAPI && browserAPI.tabs) {
                        const [tab] = await new Promise((resolve) => {
                            browserAPI.tabs.query({ active: true, currentWindow: true }, resolve);
                        });
                        this.currentTab = tab;
                    } else {
                        // Fallback for browsers without extension API
                        this.currentTab = {
                            url: window.location.href,
                            title: document.title
                        };
                    }
                } catch (error) {
                    console.error('Error getting current tab:', error);
                    this.currentTab = null;
                }
            }

            async loadSettings() {
                try {
                    if (browserAPI && browserAPI.runtime) {
                        this.settings = await new Promise((resolve) => {
                            browserAPI.runtime.sendMessage({ action: 'getSettings' }, (response) => {
                                resolve(response || {
                                    enabled: true,
                                    showNotifications: true,
                                    blockDangerous: false
                                });
                            });
                        });
                    } else {
                        this.settings = {
                            enabled: true,
                            showNotifications: true,
                            blockDangerous: false
                        };
                    }
                } catch (error) {
                    console.error('Error loading settings:', error);
                    this.settings = {
                        enabled: true,
                        showNotifications: true,
                        blockDangerous: false
                    };
                }
            }

            initializeUI() {
                // Update current URL display
                const urlElement = document.getElementById('currentUrl');
                if (this.currentTab && this.currentTab.url) {
                    try {
                        const url = new URL(this.currentTab.url);
                        urlElement.textContent = url.hostname;
                        urlElement.title = this.currentTab.url;
                    } catch {
                        urlElement.textContent = 'Invalid URL';
                    }
                } else {
                    urlElement.textContent = 'No active tab';
                }

                // Update settings toggles
                const protectionToggle = document.getElementById('protectionToggle');
                const notificationToggle = document.getElementById('notificationToggle');
                
                if (this.settings.enabled) {
                    protectionToggle.classList.add('active');
                } else {
                    protectionToggle.classList.remove('active');
                }

                if (this.settings.showNotifications) {
                    notificationToggle.classList.add('active');
                } else {
                    notificationToggle.classList.remove('active');
                }
            }

            bindEvents() {
                // Scan button
                document.getElementById('scanBtn').addEventListener('click', () => {
                    this.scanCurrentPage();
                });

                // Open scanner button
                document.getElementById('openScannerBtn').addEventListener('click', () => {
                    this.openFullScanner();
                });

                // Settings toggles
                document.getElementById('protectionToggle').addEventListener('click', () => {
                    this.toggleSetting('enabled');
                });

                document.getElementById('notificationToggle').addEventListener('click', () => {
                    this.toggleSetting('showNotifications');
                });

                // Footer links
                document.getElementById('helpLink').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.openHelp();
                });

                document.getElementById('settingsLink').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.openSettings();
                });

                document.getElementById('aboutLink').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.openAbout();
                });
            }

            async scanCurrentPage() {
                if (!this.currentTab || !this.currentTab.url) {
                    this.updatePageStatus('unknown', '❓', 'No page to scan');
                    return;
                }

                // Skip internal pages
                if (this.currentTab.url.startsWith('chrome://') || 
                    this.currentTab.url.startsWith('chrome-extension://') ||
                    this.currentTab.url.startsWith('moz-extension://') ||
                    this.currentTab.url.startsWith('about:')) {
                    this.updatePageStatus('unknown', '🏠', 'Browser internal page');
                    return;
                }

                // Show loading
                this.updatePageStatus('unknown', '🔄', 'Scanning...');
                const scanBtn = document.getElementById('scanBtn');
                const scanIcon = document.getElementById('scanIcon');
                const scanText = document.getElementById('scanText');
                
                scanBtn.disabled = true;
                scanIcon.className = 'loading';
                scanText.textContent = 'Scanning...';

                try {
                    let result;
                    
                    if (browserAPI && browserAPI.runtime) {
                        // Use extension API
                        result = await new Promise((resolve) => {
                            browserAPI.runtime.sendMessage(
                                { action: 'scanUrl', url: this.currentTab.url },
                                resolve
                            );
                        });
                    } else {
                        // Fallback: direct API call or mock analysis
                        result = await this.mockScan(this.currentTab.url);
                    }

                    // Update UI with results
                    if (result && !result.error) {
                        const status = this.getStatusClass(result.riskScore);
                        const icon = this.getStatusIcon(result.riskScore);
                        const message = `Risk: ${result.riskScore}/100 - ${result.message || 'Scan complete'}`;
                        this.updatePageStatus(status, icon, message);
                    } else {
                        this.updatePageStatus('unknown', '❌', result?.message || 'Scan failed');
                    }

                } catch (error) {
                    console.error('Scan error:', error);
                    this.updatePageStatus('unknown', '❌', 'Scan failed: ' + error.message);
                } finally {
                    // Restore button
                    scanBtn.disabled = false;
                    scanIcon.className = '';
                    scanIcon.textContent = '🔍';
                    scanText.textContent = 'Scan This Page';
                }
            }

            async mockScan(url) {
                // Simple mock analysis for fallback
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                try {
                    const urlObj = new URL(url);
                    const domain = urlObj.hostname.toLowerCase();
                    let riskScore = 0;

                    // Basic heuristics
                    if (!url.startsWith('https://')) riskScore += 10;
                    if (domain.includes('bit.ly') || domain.includes('tinyurl')) riskScore += 30;
                    if (/\d+\.\d+\.\d+\.\d+/.test(domain)) riskScore += 25;

                    return {
                        url,
                        riskScore: Math.min(riskScore, 100),
                        message: riskScore > 50 ? 'Potentially risky' : 'Appears safe',
                        status: riskScore > 70 ? 'danger' : riskScore > 40 ? 'warning' : 'safe'
                    };
                } catch {
                    return {
                        error: true,
                        message: 'Invalid URL'
                    };
                }
            }

            getStatusClass(riskScore) {
                if (riskScore >= 70) return 'danger';
                if (riskScore >= 40) return 'warning';
                return 'safe';
            }

            getStatusIcon(riskScore) {
                if (riskScore >= 70) return '🛑';
                if (riskScore >= 40) return '⚠️';
                return '✅';
            }

            updatePageStatus(statusClass, icon, message) {
                const statusElement = document.getElementById('pageStatus');
                const iconElement = document.getElementById('statusIcon');
                const textElement = document.getElementById('statusText');

                statusElement.className = `page-status ${statusClass}`;
                iconElement.textContent = icon;
                textElement.textContent = message;
            }

            async toggleSetting(key) {
                this.settings[key] = !this.settings[key];
                
                // Update UI
                const toggle = document.getElementById(key === 'enabled' ? 'protectionToggle' : 'notificationToggle');
                if (this.settings[key]) {
                    toggle.classList.add('active');
                } else {
                    toggle.classList.remove('active');
                }

                // Save settings
                if (browserAPI && browserAPI.runtime) {
                    browserAPI.runtime.sendMessage({
                        action: 'updateSettings',
                        settings: this.settings
                    });
                }
            }

            openFullScanner() {
                if (browserAPI && browserAPI.runtime) {
                    browserAPI.runtime.sendMessage({ action: 'openScanner' });
                } else {
                    // Fallback: open in new tab
                    window.open('linkguard-universal.html', '_blank');
                }
            }

            openHelp() {
                const helpUrl = 'https://github.com/your-repo/linkguard#help';
                if (browserAPI && browserAPI.tabs) {
                    browserAPI.tabs.create({ url: helpUrl });
                } else {
                    window.open(helpUrl, '_blank');
                }
            }

            openSettings() {
                this.openFullScanner();
            }

            openAbout() {
                const aboutUrl = 'https://github.com/your-repo/linkguard';
                if (browserAPI && browserAPI.tabs) {
                    browserAPI.tabs.create({ url: aboutUrl });
                } else {
                    window.open(aboutUrl, '_blank');
                }
            }

            showError(message) {
                this.updatePageStatus('unknown', '❌', message);
            }
        }

        // Initialize popup when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new LinkGuardPopup();
        });
    </script>
</body>
</html>
