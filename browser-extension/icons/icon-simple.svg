<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bgGradient)"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Shield -->
  <path d="M64 16 L32 28 L32 64 C32 88 48 108 64 112 C80 108 96 88 96 64 L96 28 Z" 
        fill="url(#shieldFill)" 
        stroke="#1f2937" 
        stroke-width="3"/>
  
  <!-- Inner Shield Detail -->
  <path d="M64 24 L40 32 L40 60 C40 78 52 94 64 98 C76 94 88 78 88 60 L88 32 Z" 
        fill="none" 
        stroke="#3b82f6" 
        stroke-width="2"/>
  
  <!-- Large Checkmark -->
  <path d="M48 60 L58 70 L80 48" 
        stroke="#10b981" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Small "LG" Text -->
  <text x="64" y="90" 
        font-family="Arial, sans-serif" 
        font-size="16" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="#1f2937">LG</text>
</svg>